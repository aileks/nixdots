# General
borderpx=2
border_radius=0
gappih=4
gappiv=4
gappoh=4
gappov=4
smartgaps=0
rootcolor=0x131210ff
bordercolor=0x58534cff
focuscolor=0xe17a3fff
urgentcolor=0xb34a45ff
scratchpadcolor=0x879b5cff
globalcolor=0x6785a1ff
overlaycolor=0x879b5cff
maximizescreencolor=0xe17a3fff
dropcolor=0x879b5c88
splitcolor=0xe17a3fff

xkb_rules_layout=aileks
repeat_rate=50
repeat_delay=250
mouse_accel_profile=1
cursor_size=24

blur=1
blur_layer=0
blur_optimized=1
blur_params_num_passes=2
blur_params_radius=5
shadows=1
layer_shadows=0
shadow_only_floating=0
focused_opacity=1.0
unfocused_opacity=0.95
animations=0
layer_animations=0
animation_fade_in=0
animation_fade_out=0
animation_duration_focus=0

# Layout
tag_num=8
default_mfact=0.5
default_nmaster=1
new_is_master=0
circle_layout=tile,monocle
sloppyfocus=1
warpcursor=0
focus_cross_monitor=0
focus_cross_tag=0
enable_hotarea=0
enable_floating_snap=1
snap_distance=32
drag_tile_to_tile=1
idleinhibit_ignore_visible=0
scratchpad_cross_monitor=1
single_scratchpad=1

# Rules
monitorrule=name:^DP-4$,width:2560,height:1440,refresh:200,x:1080,y:240,scale:1,rr:0,vrr:0
monitorrule=name:^HDMI-A-2$,width:1920,height:1080,refresh:200,x:0,y:0,scale:1,rr:1,vrr:0
tagrule=id:*,layout_name:tile
tagrule=id:1,monitor_name:^DP-4$
tagrule=id:2,monitor_name:^DP-4$
tagrule=id:3,monitor_name:^DP-4$
tagrule=id:4,monitor_name:^DP-4$
tagrule=id:5,monitor_name:^DP-4$
tagrule=id:6,monitor_name:^DP-4$
tagrule=id:7,monitor_name:^DP-4$
tagrule=id:8,monitor_name:^HDMI-A-2$

windowrule=appid:^org.wezfurlong.wezterm$,isterm:1
windowrule=appid:^imv$,isfloating:1
windowrule=appid:^org.gnome.Calculator$,isfloating:1
windowrule=appid:^[Qq]alculate-gtk$,isfloating:1
windowrule=appid:^(org\.blueman\.(Manager|Adapters|Services)|blueman-manager)$,isfloating:1
windowrule=appid:^[Bb]itwarden$,isfloating:1
windowrule=appid:^(org\.localsend\.localsend_app|[Ll]ocal[Ss]end|localsend_app)$,isfloating:1
windowrule=appid:^nm-connection-editor$,isfloating:1
windowrule=appid:^polkit-gnome.*,isfloating:1
windowrule=appid:^xdg-desktop-portal-gtk$,isfloating:1
windowrule=appid:^mpv$,focused_opacity:1.0,unfocused_opacity:1.0

# Keybinds
bind=SUPER,space,spawn,wmenu-run
bind=SUPER,Return,spawn,wezterm start --always-new-process
bind=SUPER,t,spawn,tmux-dmenu
bind=SUPER,w,spawn,zen-browser-twilight
bind=SUPER,e,spawn,wezterm start --always-new-process -- yazi
bind=SUPER,s,spawn,signal-desktop
bind=SUPER,a,spawn,wezterm start --always-new-process -- wiremix
bind=SUPER,m,spawn,fastmail
bind=SUPER,o,spawn,color-picker
bind=SUPER,v,spawn,clipboard-menu
bind=SUPER,semicolon,spawn,bemoji -n
bind=SUPER,Escape,spawn,loginctl lock-session
bind=SUPER,n,spawn,dnd-toggle
bind=SUPER+CTRL,n,spawn,night-light
bind=SUPER+SHIFT,p,spawn,power-menu
bind=SUPER,r,spawn,record-menu
bind=NONE,Print,spawn,screenshot region
bind=CTRL,Print,spawn,screenshot window
bind=SHIFT,Print,spawn,screenshot full
bind=SUPER,Print,spawn,screenrecord region
bind=SUPER+SHIFT,Print,spawn,screenrecord output
bind=SUPER+CTRL,space,spawn,desktop-actions
bind=SUPER+SHIFT,o,spawn,region-ocr
bind=SUPER+CTRL,o,spawn,qr-scan
bind=SUPER+CTRL,r,spawn,reminder
bind=SUPER,equal,spawn,calculate
bind=SUPER+SHIFT,n,spawn,notification-history
bind=SUPER+CTRL+SHIFT,n,spawn,dunstctl context
bind=SUPER+CTRL,m,spawn,monitor-menu

bind=SUPER,q,killclient
bind=SUPER,f,togglefullscreen
bind=SUPER,b,spawn,pkill -SIGUSR1 -x waybar
bind=SUPER+SHIFT,space,togglefloating
bind=SUPER,j,focusstack,next
bind=SUPER,k,focusstack,prev
bind=SUPER+SHIFT,j,exchange_stack_client,next
bind=SUPER+SHIFT,k,exchange_stack_client,prev
bind=SUPER,h,setmfact,-0.05
bind=SUPER,l,setmfact,+0.05
bind=SUPER+CTRL,j,resizewin,+0,+40
bind=SUPER+CTRL,k,resizewin,+0,-40
bind=SUPER+CTRL,Return,spawn,desktop-tag reset-size
bind=SUPER,i,incnmaster,+1
bind=SUPER+SHIFT,i,incnmaster,-1
bind=SUPER+SHIFT,Return,zoom
bind=SUPER,Tab,view,-1,0
bind=SUPER,comma,focusmon,left
bind=SUPER,period,focusmon,right
bind=SUPER+SHIFT,comma,spawn,desktop-tag send-monitor left
bind=SUPER+SHIFT,period,spawn,desktop-tag send-monitor right
bind=SUPER,grave,toggle_scratchpad
bind=SUPER+SHIFT,grave,minimized
bind=SUPER+CTRL,grave,restore_minimized,0
bind=SUPER+SHIFT,q,quit
bind=SUPER+SHIFT,r,reload_config

bind=NONE,XF86AudioPlay,spawn,playerctl play-pause
bind=NONE,XF86AudioPause,spawn,playerctl play-pause
bind=NONE,XF86AudioNext,spawn,playerctl next
bind=NONE,XF86AudioPrev,spawn,playerctl previous
bind=NONE,XF86AudioRaiseVolume,spawn,volume up
bind=NONE,XF86AudioLowerVolume,spawn,volume down
bind=NONE,XF86AudioMute,spawn,volume mute
bind=NONE,XF86AudioMicMute,spawn,microphone-mute
bind=NONE,XF86MonBrightnessUp,spawn,brightness up
bind=NONE,XF86MonBrightnessDown,spawn,brightness down

mousebind=SUPER,btn_left,moveresize,curmove
mousebind=SUPER,btn_middle,togglefloating
mousebind=SUPER,btn_right,moveresize,curresize
axisbind=SUPER,UP,focusstack,prev
axisbind=SUPER,DOWN,focusstack,next
