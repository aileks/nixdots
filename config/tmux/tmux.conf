# Terminal
set -g default-terminal "tmux-256color"
set -as terminal-features ",st-256color:ccolour:usstyle"
set -as terminal-overrides ",st-256color:Nobr"
setw -g mode-keys vi
setw -g monitor-activity on
set -g extended-keys on
set -s extended-keys-format csi-u

# Keybinds
unbind C-b
set -g prefix C-space
bind C-space send-prefix
bind c new-window
bind n next-window
bind p previous-window
bind v copy-mode
bind t display-popup -h 99% -w 99%
bind o display-popup -E "tms"
bind s display-popup -E "tms switch"
bind w display-popup -E "tms windows"
bind Space last-window
bind ^ switch-client -l
bind - split-window -v -c "#{pane_current_path}"
bind | split-window -h -c "#{pane_current_path}"
bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi C-v send-keys -X rectangle-toggle
bind -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "xclip -selection clipboard -in"
bind -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel "xclip -selection clipboard -in"
bind -n M-h select-pane -L
bind -n M-j select-pane -D
bind -n M-k select-pane -U
bind -n M-l select-pane -R
bind -n M-H resize-pane -L 5
bind -n M-J resize-pane -D 5
bind -n M-K resize-pane -U 5
bind -n M-L resize-pane -R 5

# Config
set -g history-limit 10000
set -g renumber-windows on
set -g bell-action any
set -g set-titles on
set -g base-index 1
set -g detach-on-destroy off
set -g visual-bell off
set -g visual-activity off
set -g allow-rename off
set -g pane-base-index 1
set -g focus-events on
set -g mouse on
set -g escape-time 50
set -g set-clipboard on
set -g status-justify absolute-centre
set -g status-position top

# Theme
black="#131210"
charcoal="#1B1916"
dark_gray="#23201C"
gray="#58534C"
light_gray="#9A938A"
silver="#BBB3A9"
white="#DDD5CA"
red="#B34A45"
orange="#E17A3F"
yellow="#D9A441"
green="#879B5C"
blue="#6785A1"
purple="#9A788F"

set -g status-style "fg=${silver},bg=${black}"
set -g window-status-format " #I:#W "
set -g window-status-current-format " #I:#W "
set -g window-status-current-style "fg=${purple},bg=${charcoal}"
set -g window-status-style "fg=${light_gray},bg=${charcoal}"
set -g window-status-activity-style "fg=${green},bg=${charcoal},bold"
set -g window-status-bell-style "fg=${white},bg=${red},bold"
set -g pane-border-style "fg=${gray}"
set -g pane-active-border-style "fg=${orange}"
set -g message-style "fg=${white},bg=${dark_gray}"
set -g message-command-style "fg=${light_gray},bg=${dark_gray}"
set -g popup-style "fg=${silver},bg=${charcoal}"
set -g popup-border-style "fg=${orange}"
set -g mode-style "fg=${black},bg=${yellow},bold"
set -g copy-mode-selection-style "fg=${black},bg=${light_gray},bold"
set -g copy-mode-match-style "fg=${yellow},bg=${dark_gray}"
set -g copy-mode-current-match-style "fg=${black},bg=${yellow},bold"
set -g status-left "#[fg=${orange},bold] #S #[fg=${orange},bg=${black}]"
set -g status-right "#[fg=${blue},bg=${black},bold] #h #[fg=${light_gray},bg=${black}]"
set -g status-left-length 50
set -g status-right-length 100
set -g status-interval 1
