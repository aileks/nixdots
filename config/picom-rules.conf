rules = (
  { match = "window_type = 'normal' && !focused && !_NET_WM_WINDOW_OPACITY"; opacity = 0.95; },
  { match = "focused || group_focused"; opacity = 1.0; },
  { match = "_GTK_FRAME_EXTENTS@"; shadow = false; blur-background = false; },
  {
    match = "window_type = 'desktop' || window_type = 'dock' || window_type = 'menu' || window_type = 'dropdown_menu' || window_type = 'popup_menu' || window_type = 'tooltip' || window_type = 'combo' || window_type = 'dnd' || window_type = 'notification'";
    shadow = false;
    blur-background = false;
    fade = false;
    opacity = 1.0;
  },
  {
    # Zen uses a utility window for its native context menus.
    match = "(class_g = 'zen-twilight' && window_type = 'utility' && role = 'Popup') || class_g = 'slop' || class_g = 'voxtype-osd-gtk4' || class_g = 'Dunst'";
    shadow = false;
    blur-background = false;
    fade = false;
    opacity = 1.0;
  },
  { match = "fullscreen"; shadow = false; blur-background = false; opacity = 1.0; }
);
