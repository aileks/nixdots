font_family family="Iosevka Term Extended" style=Regular
bold_font family="Iosevka Term Extended" style=Bold
italic_font family="Iosevka Term Extended" style=Italic
bold_italic_font family="Iosevka Term Extended" style="Bold Italic"
font_size 13

background_opacity 0.95
hide_window_decorations yes
window_padding_width 2
